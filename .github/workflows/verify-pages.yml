# Pagesデプロイの見張り番: push後にビルド結果を確認し、
# "Deployment failed, try again later"(GitHub側の一時不調)なら自動で再ビルドを要求する。
# 2026-07-02〜03にこの一時不調が断続発生し、ダッシュボードが数時間古いまま
# 止まったことへの対策。公開リポジトリなのでActions分は消費しない。
name: Pagesデプロイ検証

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  pages: write
  contents: read

concurrency:
  group: verify-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: ビルド完了を確認(失敗なら再要求・最大3回)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          retried=0
          for i in $(seq 1 10); do
            sleep 45
            info=$(gh api "repos/${{ github.repository }}/pages/builds/latest" \
                     --jq '.status + " " + .commit' || echo "unknown unknown")
            status=${info%% *}; sha=${info##* }
            echo "[$i] pages build: status=$status commit=${sha:0:7} (期待 ${GITHUB_SHA:0:7})"
            if [ "$sha" = "$GITHUB_SHA" ] && [ "$status" = "built" ]; then
              echo "デプロイ反映を確認"
              exit 0
            fi
            if [ "$status" = "errored" ] && [ "$retried" -lt 3 ]; then
              retried=$((retried+1))
              echo "ビルド失敗を検出 → 再ビルド要求 ($retried/3)"
              gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
            fi
          done
          echo "::warning::監視時間内にPagesビルドが完了しませんでした"
          if [ -n "${{ vars.NTFY_TOPIC }}" ]; then
            curl -s -X POST "https://ntfy.sh/" -H "Content-Type: application/json" \
              -d "{\"topic\":\"${{ vars.NTFY_TOPIC }}\",\"title\":\"⚠ Market Compass 配信遅延\",\"message\":\"GitHub Pagesのデプロイが自動リトライ後も完了していません。次回更新で回復する見込みですが、続くようならActionsを確認してください。\",\"priority\":3}" || true
          fi
